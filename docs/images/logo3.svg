<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Thick, High-Contrast Connection Lines -->
  <g fill="none" stroke="#1E293B" stroke-linecap="round" stroke-width="44">
    <!-- Center to Top-Right -->
    <path d="M 256 256 L 370 142" />
    
    <!-- Center to Bottom-Right -->
    <path d="M 256 256 L 370 370" />
    
    <!-- Center to Far Left -->
    <path d="M 256 256 L 130 256" />
  </g>

  <!-- Central Core Node -->
  <circle cx="256" cy="256" r="64" fill="#1E293B" />

  <!-- Outer Main Nodes (Enlarged for high visibility) -->
  <circle cx="130" cy="256" r="46" fill="#1E293B" />
  <circle cx="370" cy="142" r="46" fill="#1E293B" />
  <circle cx="370" cy="370" r="46" fill="#1E293B" />
</svg>
